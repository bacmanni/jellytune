name: Build packages

on:
  workflow_dispatch:

env:
  VERSION: 1.2.3

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runtime: linux-x64
            runner: ubuntu-22.04
            linuxdeploy_arch: x86_64
            artifact_suffix: x86_64

          - arch: aarch64
            runtime: linux-arm64
            runner: ubuntu-22.04-arm
            linuxdeploy_arch: aarch64
            artifact_suffix: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:flatpak/stable -y
          sudo apt update
          sudo apt-get install -y libglib2.0-dev libfuse2 libfuse3-3 flatpak flatpak-builder libgtk-4-dev libgtk-4-1 librsvg2-dev libgirepository1.0-dev unzip libadwaita-1-dev libadwaita-1-0
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install flathub org.gnome.Platform//51 -y
          sudo flatpak install flathub org.gnome.Sdk//51 -y

      - name: Install PupNet
        run: |
          dotnet tool update -g KuiperZone.PupNet --version 1.9.0

      - name: Build raw deployment with PupNet
        run: |
          pupnet --runtime ${{ matrix.runtime }} --kind zip --build Release --yes

      - name: Extract PupNet deployment
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp "Deploy/JellyTune.desktop" AppDir
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp Icons/JellyTune.svg AppDir/usr/share/icons/hicolor/scalable/apps/io.github.bacmanni.jellytune.svg
          unzip "Deploy/JellyTune-${VERSION}-1.${{ matrix.runtime }}.zip" -d AppDir

      - name: Download linuxdeploy
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage" -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Download linuxdeploy GTK plugin
        run: |
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" -O linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh
          
      - name: Download linuxdeploy Gstreamer plugin
        run: |
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh" -O linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy-plugin-gstreamer.sh
      - name: Copy GSettings Schemas
        run: |
          mkdir -p AppDir/usr/share/glib-2.0/schemas/
          cp -r /usr/share/glib-2.0/schemas/* AppDir/usr/share/glib-2.0/schemas/
          glib-compile-schemas AppDir/usr/share/glib-2.0/schemas/
      - name: Build AppImage
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ env.VERSION }}
          LINUXDEPLOY_OUTPUT_APP_NAME: JellyTune
          DEPLOY_GTK_VERSION: 4
          GTK_PATH: "/usr/lib/${{ matrix.linuxdeploy_arch }}-linux-gnu/libadwaita-1.so.0"
          ADWAITA_PATH: "/usr/lib/${{ matrix.linuxdeploy_arch }}-linux-gnu/libgtk-4.so.1"
          LIBSSL_PATH: "/usr/lib/${{ matrix.linuxdeploy_arch }}-linux-gnu/libssl.so.3"
          LIBCRYPTO_PATH: "/usr/lib/${{ matrix.linuxdeploy_arch }}-linux-gnu/libcrypto.so.3"
        run: |
          ./linuxdeploy.AppImage --appdir AppDir --plugin gtk --plugin gstreamer --desktop-file AppDir/JellyTune.desktop --library ${{ env.GTK_PATH }} --library ${{ env.ADWAITA_PATH }} --library ${{ env.LIBSSL_PATH }} --library ${{ env.LIBCRYPTO_PATH }} --executable AppDir/JellyTune --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: JellyTune-dev.${{ matrix.artifact_suffix }}.appImage
          path: JellyTune-${{ env.VERSION }}-${{ matrix.artifact_suffix }}.AppImage

      - name: Create Flatpak
        run: |
          pupnet --runtime ${{ matrix.runtime }} --kind flatpak --build Release --yes

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v5
        with:
          name: JellyTune-dev.${{ matrix.artifact_suffix }}.flatpak
          path: Deploy/JellyTune-*.flatpak
