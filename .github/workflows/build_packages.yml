name: Build packages

on:
  workflow_dispatch:

env:
  VERSION: 1.2.3

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runtime: linux-x64
            runner: ubuntu-26.04
            linuxdeploy_arch: x86_64
            artifact_suffix: x86_64

          - arch: aarch64
            runtime: linux-arm64
            runner: ubuntu-26.04-arm
            linuxdeploy_arch: aarch64
            artifact_suffix: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'

      - name: Install dependencies
        run: |
          sudo add-apt-repository ppa:flatpak/stable -y
          sudo apt update
          sudo apt-get install -y libglib2.0-dev libfuse2t64 fuse3 flatpak flatpak-builder libgtk-4-dev libgtk-4-1 librsvg2-dev libgirepository1.0-dev unzip libadwaita-1-dev libadwaita-1-0
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install flathub org.gnome.Platform//51 -y
          sudo flatpak install flathub org.gnome.Sdk//51 -y

      - name: Install PupNet
        run: |
          dotnet tool update -g KuiperZone.PupNet --version 1.9.0
          
      - name: Download appimage tool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool-${{ matrix.arch }}.AppImage
          
      - name: Build appimage with PupNet
        run: |
          pupnet --runtime ${{ matrix.runtime }} --kind appimage --build Release --yes

      - name: Extract PupNet appimage
        run: |
          chmod +x ./Deploy/JellyTune-${{env.VERSION}}-1.${{ matrix.artifact_suffix }}.AppImage
          ./Deploy/JellyTune-${{env.VERSION}}-1.${{ matrix.artifact_suffix }}.AppImage --appimage-extract

      - name: Inject Glibc Check & Add Dependencies
        run: |
          # 1. Inject the glibc version check directly into the top of PupNet's AppRun script
          sed -i '2i \
          SYSTEM_GLIBC=$(ldd --version | head -n1 | awk "{print \$NF}")\n\
          REQUIRED_GLIBC="2.43"\n\
          if [ "$(printf "%s\\n" "$REQUIRED_GLIBC" "$SYSTEM_GLIBC" | sort -V | head -n1)" != "$REQUIRED_GLIBC" ]; then\n\
              ERROR_MSG="This AppImage requires glibc $REQUIRED_GLIBC or newer (e.g., Ubuntu 26.04+).\\nYour system has glibc $SYSTEM_GLIBC."\n\
              if command -v zenity &> /dev/null; then\n\
                  zenity --error --text="$ERROR_MSG" --title="System Too Old"\n\
              else\n\
                  echo -e "\\nERROR: $ERROR_MSG\\n"\n\
              fi\n\
              exit 1\n\
          fi\n' squashfs-root/AppRun

          # 2. Force-bundle libadwaita so the AppImage doesn't rely on the host system
          cp /usr/lib/*/libadwaita-1.so* squashfs-root/usr/lib/ 2>/dev/null || true

          # 3. Force-bundle the Adwaita and hicolor icon themes
          mkdir -p squashfs-root/usr/share/icons/
          cp -r /usr/share/icons/Adwaita squashfs-root/usr/share/icons/ 2>/dev/null || true
          cp -r /usr/share/icons/hicolor squashfs-root/usr/share/icons/ 2>/dev/null || true

          # 4. Copy and compile the modern schemas
          mkdir -p squashfs-root/usr/share/glib-2.0/schemas/
          cp /usr/share/glib-2.0/schemas/*.xml squashfs-root/usr/share/glib-2.0/schemas/ 2>/dev/null || true
          glib-compile-schemas squashfs-root/usr/share/glib-2.0/schemas/ || true
          
      - name: Download and extract appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.linuxdeploy_arch }}.AppImage
          chmod +x appimagetool-${{ matrix.linuxdeploy_arch }}.AppImage

      - name: Repackage AppImage
        env:
          ARCH: ${{ matrix.linuxdeploy_arch }}
        run: |
          # Use the extracted appimagetool to repack your perfectly configured squashfs-root!
          ./appimagetool-${{ matrix.linuxdeploy_arch }}.AppImage squashfs-root JellyTune-${{ env.VERSION }}-${{ matrix.artifact_suffix }}.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: JellyTune-dev.${{ matrix.artifact_suffix }}.appImage
          path: JellyTune-${{ env.VERSION }}-${{ matrix.artifact_suffix }}.AppImage

      - name: Create Flatpak
        run: |
          pupnet --runtime ${{ matrix.runtime }} --kind flatpak --build Release --yes

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v5
        with:
          name: JellyTune-dev.${{ matrix.artifact_suffix }}.flatpak
          path: Deploy/JellyTune-*.flatpak
